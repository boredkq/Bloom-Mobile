name: Release

# Builds Android and iOS. A tag v1.2.3 publishes both as a GitHub release; the
# Actions button builds them just to look at.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: What to build
        type: choice
        default: all
        options: [all, android, ios]

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  android:
    name: Android (APK)
    if: github.event_name == 'push' || contains(fromJSON('["all","android"]'), inputs.platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Without a key Gradle signs with the debug one, and APKs of different runs
      # don't install over each other.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK gets the debug key and won't install over the last version"
            exit 0
          fi
          # A web form brings line breaks and spaces along, and base64 refuses them.
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks
          if [ ! -s android/upload-keystore.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 doesn't unpack into a file: the secret is cut, set it again"
            exit 1
          fi
          printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      # v1.2.3 gives 1.2.3. The build number is the run counter: Android needs it
      # to grow from release to release. A manual run has no tag: pubspec's version.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "VERSION_ARGS=--build-name=$version --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: flutter pub get

      # Universal: heavier than per-ABI ones, but one file that installs anywhere.
      - name: flutter build apk
        run: flutter build apk --release $VERSION_ARGS

      - name: Rename
        run: mv build/app/outputs/flutter-apk/app-release.apk "bloom-$VERSION.apk"

      # Three days: it's only handed over to the release, which is kept apart.
      # Longer ones pile up and hit the storage quota.
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-${{ env.VERSION }}-android
          path: bloom-${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS (unsigned)
    if: github.event_name == 'push' || contains(fromJSON('["all","ios"]'), inputs.platforms)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "VERSION_ARGS=--build-name=$version --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: flutter pub get

      # No Apple certificate: the .ipa installs only after re-signing (Sideloadly,
      # AltStore, Xcode).
      - name: flutter build ios
        run: flutter build ios --release --no-codesign $VERSION_ARGS

      # An .ipa is a zip with Payload/Runner.app; Xcode only makes it when signing.
      - name: Package .ipa
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qry "bloom-$VERSION.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: bloom-${{ env.VERSION }}-ios
          path: bloom-${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 3

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Bloom ${{ github.ref_name }}
          # GitHub writes the description: the link to everything changed since the last tag.
          generate_release_notes: true
          files: dist/*/*
