name: Проверки

# A quick check on every push and pull request: formatting, analyzer, tests. App
# builds are slow and have their own workflow.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run: there's no point
# checking a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  check:
    name: format · analyze · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: flutter analyze
        run: flutter analyze lib test tool

      # The smoke tools hit live services, so only `flutter test` runs here and
      # smoke runs by hand.
      - name: flutter test
        run: flutter test
