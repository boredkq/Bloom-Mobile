# Translations codegen. It runs by itself on every `flutter run` and `flutter
# build`, but a new key needs a rebuild: hot reload isn't enough.
#
# English is the source of truth: it gives the key list and placeholder types.
# Russian must cover all of it; missing keys are caught at generation.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
untranslated-messages-file: l10n-missing.json
